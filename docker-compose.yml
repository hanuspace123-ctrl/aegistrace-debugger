services:
  aegistrace:
    build: .
    container_name: aegistrace
    environment:
      - NODE_ENV=production
      - PORT=8000
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 3
